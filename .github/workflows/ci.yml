name: Portable checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev python3-cryptography
      - name: Run portable tests
        run: make test PYTHON=/usr/bin/python3
      - name: Check repository contents
        run: make check PYTHON=/usr/bin/python3
